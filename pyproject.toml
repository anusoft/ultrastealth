[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrastealth"
version = "0.1.0"
description = "Maximum-stealth browser automation in Python — rebrowser-playwright (CDP-leak fixes) + Xvfb + consistent real-Chrome fingerprint + MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "anu" }]
keywords = ["scraping", "stealth", "playwright", "anti-bot", "mcp", "automation"]
dependencies = [
    "rebrowser-playwright",
    "nest-asyncio",
    # mcp 2.0.0 renamed FastMCP to MCPServer and rewrote the wire protocol (see
    # modelcontextprotocol/python-sdk release notes) — mcp_server.py has been
    # migrated to the v2 API, so floor here rather than allowing a v1 install.
    "mcp[cli]>=2.0.0",
    "psutil",
    "uvicorn",
]

[project.optional-dependencies]
# Interactive REPLs (ultrastealth.repl / ultrastealth.agent_repl)
repl = ["ipython", "openai"]
# Alternative browser-automation engine (fetcher.py: engine="patchright" /
# ULTRASTEALTH_ENGINE=patchright). Opt-in, not a core requirement: rebrowser-
# playwright above remains the default engine. See CLAUDE.md for the
# verified compatibility findings before switching a workload over.
patchright = ["patchright"]

[project.urls]
Homepage = "https://anusoft.github.io/ultrastealth/"
Repository = "https://github.com/anusoft/ultrastealth"

[project.scripts]
ultrastealth = "ultrastealth.cli:main"
us = "ultrastealth.cli:main"
ultrastealth-mcp = "ultrastealth.mcp_server:main"
ultrastealth-install = "ultrastealth.install:main"
ultrastealth-patch = "ultrastealth.patch_rebrowser:main"

# The published repo keeps the package modules at the repository root, so map the
# `ultrastealth` import package to "." (the directory containing this file).
[tool.setuptools]
packages = ["ultrastealth"]

[tool.setuptools.package-dir]
ultrastealth = "."
